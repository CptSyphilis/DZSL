name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream desktop-file-utils flatpak-builder \
            gir1.2-adw-1 gir1.2-gtk-4.0 python3-gi

      - name: Validate release metadata
        run: ./bin/check-release.py

      - name: Validate scripts and metadata
        run: |
          bash -n bin/*.sh
          appstreamcli validate --no-net packaging/flatpak/com.dayzlinux.dzsl.metainfo.xml
          desktop-file-validate packaging/flatpak/com.dayzlinux.dzsl.desktop
          flatpak-builder --show-manifest packaging/flatpak/com.dayzlinux.dzsl.yml >/dev/null

      - name: Run tests
        run: |
          python3 -m compileall -q dzsl tests
          python3 -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade build
      - run: python -m compileall -q dzsl
      - run: python -m build
